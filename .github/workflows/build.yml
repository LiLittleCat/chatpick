name: Build Chrome extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm compile

      - name: Build and package Chrome extension
        run: pnpm zip

      - name: Verify store package
        shell: python
        run: |
          import json
          import zipfile
          from pathlib import Path

          packages = list(Path('.output').glob('*-chrome.zip'))
          assert len(packages) == 1, 'Expected one Chrome extension ZIP'
          with zipfile.ZipFile(packages[0]) as archive:
              assert archive.testzip() is None, 'Corrupt ZIP entry'
              manifest = json.loads(archive.read('manifest.json'))
              assert manifest['manifest_version'] == 3, 'Expected Manifest V3'
              version = json.loads(Path('package.json').read_text())['version']
              assert manifest['version'] == version, 'Package version mismatch'
              for filename in ('THIRD-PARTY-NOTICES.txt', 'fonts/OFL.txt', 'fonts/NotoSansSC-Regular.ttf', 'pdf-export.js'):
                  assert filename in archive.namelist(), f'Missing bundled resource: {filename}'
          print(f'Verified {packages[0]}')

      - name: Upload Chrome extension ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: .output/*-chrome.zip
          include-hidden-files: true
          archive: false
          if-no-files-found: error
          retention-days: 30
